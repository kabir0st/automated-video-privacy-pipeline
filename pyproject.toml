[project]
name = "automated-video-privacy-pipeline"
version = "0.2.0"
description = "Offline face-anonymization pipeline with a live tuning inspector — detect, track, and blur faces in video."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "imageio-ffmpeg>=0.5.1",
    "numpy>=1.26",
    "onnx>=1.16",
    "onnxconverter-common>=1.16.0",
    "onnxruntime>=1.26.0",
    "opencv-python>=4.9",
    "pyqt6>=6.6.0",
    "scipy>=1.17.1",
]

[dependency-groups]
dev = [
    "pyinstaller>=6.20.0",
    "pytest>=9.1.1",
]
