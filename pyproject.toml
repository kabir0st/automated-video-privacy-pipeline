[project]
name = "automated-video-privacy-pipeline"
version = "0.2.0"
description = "Offline face-anonymization pipeline with a live tuning inspector — detect, track, and blur faces in video."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "boxmot>=21.0.0",
    "imageio-ffmpeg>=0.5.1",
    "insightface>=1.0.1",
    "mediapipe>=0.10.35",
    "onnxconverter-common>=1.16.0",
    "onnxruntime>=1.26.0",
    "pyqt6>=6.6.0",
    "rtmlib>=0.0.15",
    "scipy>=1.17.1",
]

[dependency-groups]
dev = [
    "pyinstaller>=6.20.0",
]
